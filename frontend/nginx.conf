server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints these filenames, so a change produces a new name and an
  # old name can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The router owns every path. Anything that is not a real file has to reach
  # index.html, or reloading /orders returns a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API, on the same origin.
  #
  # The upstream goes through a variable on purpose. Naming a host directly
  # makes nginx resolve it while loading its config, so an API that is still
  # starting takes the whole site down with it — including the static files it
  # has nothing to do with. A variable defers the lookup to request time, so
  # the app still loads and only its data calls fail. The rewrite does the
  # prefix stripping that a trailing slash would have done.
  location /api/ {
    resolver 127.0.0.11 valid=10s; # Docker's embedded DNS
    set $upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The event stream is one response that never ends. Buffering would hold
    # each frame until nginx decided it had enough, and a normal read timeout
    # would cut the connection every minute.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_read_timeout 24h;
  }
}
